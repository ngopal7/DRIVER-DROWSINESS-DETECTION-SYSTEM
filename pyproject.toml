[project]
name = "driver-drowsiness"
version = "0.1.0"
description = "Configurable HRV driver-drowsiness research stack"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyWavelets>=1.5", "scikit-learn>=1.3", "PyYAML>=6"]

[project.optional-dependencies]
deep-learning = ["tensorflow>=2.13"]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_processing*", "validation*", "labeling*", "modeling*", "data_collection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
